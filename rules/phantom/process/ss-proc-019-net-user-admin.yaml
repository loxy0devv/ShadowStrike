id: ss-proc-019
detection_name: "Win32/Discovery.AdminEnum"
description: "Process enumerated local administrators or domain groups — common in post-exploitation discovery phase."
scope: process
severity: medium
status: stable
source: native
confidence: 0.65
weight: 1.5
version: 1
attack:
  - tactic: TA0007
    technique: T1069
    name: "Permission Groups Discovery"
logic:
  and:
    - field_in:
        field: process.name
        values: [net.exe, net1.exe]
        case_insensitive: true
    - or:
        - field_contains:
            field: process.command_line
            value: "localgroup administrators"
        - field_contains:
            field: process.command_line
            value: "localgroup"
        - field_contains:
            field: process.command_line
            value: "group /domain"
        - field_contains:
            field: process.command_line
            value: "user /domain"
fp_guard:
  notes:
    - "IT administrators legitimately enumerate group membership."
    - "Correlate with other discovery commands for escalation."
