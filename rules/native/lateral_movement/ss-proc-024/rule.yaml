id: ss-proc-024
detection_name: "Win32/WMIC.RemoteProcess.Spawn"
description: "Detects wmic.exe spawning a remote process via the /node: flag or process call create syntax. Adversaries use WMIC to execute commands on remote systems for lateral movement, often combining it with pass-the-hash or valid credentials to invoke payloads without touching remote file shares."
scope: process
severity: high
status: stable
source: native
confidence: 0.82
weight: 2.0
version: 1

attack:
  - tactic: TA0008
    technique: T1047
    name: "Windows Management Instrumentation"

references:
  - url: "https://attack.mitre.org/techniques/T1047/"
    title: "ATT&CK T1047"
  - url: "https://lolbas-project.github.io/lolbas/Binaries/Wmic/"
    title: "LOLBAS WMIC"

logic:
  and:
    - field_in:
        field: process.name
        values:
          - wmic.exe
        case_insensitive: true
    - or:
        - field_regex:
            field: process.command_line
            pattern: "(?i)/node:['\"]?[0-9a-zA-Z.-]+"
        - field_regex:
            field: process.command_line
            pattern: "(?i)process\\s+(call\\s+)?create"
        - field_regex:
            field: process.command_line
            pattern: "(?i)process\\s+get\\s+.*commandline"

fp_guard:
  notes:
    - "Sysadmin scripts and monitoring tools (e.g., SCCM, Nagios) legitimately use WMIC /node: for inventory. Correlate with asset management baselines."
    - "Endpoint management solutions may invoke wmic process create for deployment tasks."
  suppress:
    - field: process.parent.name
      values:
        - ccmexec.exe
        - nsclient++.exe
        - zabbix_agentd.exe
