id: ss-seq-003
detection_name: "Win32/CredTheft.DumpChain"
description: "Credential dumping chain: enumeration followed by LSASS / SAM access or direct dump utility execution."
scope: sequence
severity: critical
status: stable
source: native
confidence: 0.85
weight: 3.5
version: 1
attack:
  - tactic: TA0006
    technique: T1003
    name: "OS Credential Dumping"
logic:
  sequence:
    - or:
        - field_contains:
            field: process.command_line
            value: "whoami"
        - field_contains:
            field: process.command_line
            value: "net user"
        - field_contains:
            field: process.command_line
            value: "net localgroup"
    - or:
        - field_in:
            field: process.name
            values: [mimikatz.exe, procdump.exe, wce.exe, fgdump.exe, pwdump.exe, gsecdump.exe]
            case_insensitive: true
        - field_contains:
            field: process.command_line
            value: "sekurlsa"
        - field_contains:
            field: process.command_line
            value: "lsadump"
        - field_contains:
            field: process.command_line
            value: "-ma lsass"
        - field_contains:
            field: process.command_line
            value: "comsvcs"
fp_guard:
  notes:
    - "Penetration testing and IT audits legitimately run these tools."
    - "Require correlation with unauthorized access or suspicious parent process."
