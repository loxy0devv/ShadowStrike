name: Build & Package

on:
  push:
    branches: [main, master, dev]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on the same ref (keeps queue clean on fast-push branches)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM_TOOLSET: v143
  PLATFORM: x64
  # Force 64-bit compiler host — avoids the ~2 GB heap cap of HostX86 (32-bit CL).
  PREFER_TOOL_ARCH: x64
  # CI-only: disable Whole-Program Optimization (LTCG, /GL + /LTCG).
  # LTCG keeps every TU's IR in memory for cross-unit inlining; on the 7 GB
  # runner this overflows when compiling JITCompiler.cpp under /O2.
  # The binary is still fully correct — only peak throughput is marginally lower.
  # Local release builds and tagged releases should still use LTCG.
  WPO_OVERRIDE: /p:WholeProgramOptimization=false
  # Limit parallel CL invocations to 2 to halve peak RSS.
  # /m already builds projects in parallel; /MP within a project multiplies that.
  MP_OVERRIDE: /p:MultiProcessorCompilation=true /p:CL_MPCount=2
  # Force Node.js 24 for all actions (mandatory from June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # Job 1: User-mode binaries
  # Build order: PhantomCoreLib (static lib) → Service → Tray → UI
  # The service vcxproj has a ProjectReference to PhantomCoreLib so MSBuild
  # would handle ordering, but we drive them explicitly for clear log separation.
  # ============================================================================
  build-usermode:
    name: User-mode binaries (x64 Release)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Restoring intermediate build files shaves ~40% off repeat builds.
      # Key covers all vcxproj + props + source files so a stale cache is
      # never used after code changes.
      - name: Cache MSBuild intermediates
        uses: actions/cache@v4
        with:
          path: x64
          key: msbuild-${{ runner.os }}-${{ hashFiles('**/*.vcxproj', '**/*.props', 'src/**/*.cpp', 'src/**/*.hpp', 'PhantomEmulator/**/*.cpp') }}
          restore-keys: msbuild-${{ runner.os }}-

      # Cache the compiled rules blob separately, keyed on the rules/ directory
      # content. When rules haven't changed the blob is restored and the bake
      # step is skipped entirely. The PhantomCoreLib PreBuildEvent runs the same
      # script (idempotent) but this explicit step gives clear CI log attribution
      # and avoids the I/O on cache-hit builds.
      - name: Cache rules blob
        id: rules-blob-cache
        uses: actions/cache@v4
        with:
          path: src/PhantomCore/Detection/Rules/RulesBlob.generated.cpp
          key: rules-blob-${{ runner.os }}-${{ hashFiles('rules/**') }}

      # Compile all rule corpora (capa 9.4.0 / Sigma / Elastic / native phantom)
      # into an XOR-obfuscated C++ byte array embedded in the service binary.
      # Rules are NOT shipped as plaintext on disk in production packages.
      - name: Bake rule corpus into binary blob
        if: steps.rules-blob-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools/bake_rules.ps1 `
            -SolutionDir "$env:GITHUB_WORKSPACE" `
            -OutFile "$env:GITHUB_WORKSPACE\src\PhantomCore\Detection\Rules\RulesBlob.generated.cpp"
          $f  = "$env:GITHUB_WORKSPACE\src\PhantomCore\Detection\Rules\RulesBlob.generated.cpp"
          $kb = [math]::Round((Get-Item $f).Length / 1KB, 1)
          Write-Host "RulesBlob.generated.cpp: ${kb} KB"

      # Build the JIT sub-library first with clang-cl.
      # clang-cl handles JITCompiler.cpp without the heap exhaustion that MSVC
      # hits under /O2 on this translation unit. No WPO override needed here
      # because ClangCL never emits MSVC LTCG bitcode anyway.
      - name: Build PhantomJIT (clang-cl static library)
        shell: pwsh
        run: |
          msbuild PhantomJIT.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            /m:1 /nologo /flp:"LogFile=build_jit.log;Verbosity=minimal"

      - name: Build PhantomCoreLib (engine static library)
        shell: pwsh
        run: |
          msbuild PhantomCoreLib.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            $env:WPO_OVERRIDE $env:MP_OVERRIDE `
            /m:1 /nologo /flp:"LogFile=build_corelib.log;Verbosity=minimal"

      # OpenSSL MSVC import libs (libcrypto.lib / libssl.lib) are required by the
      # linker but are NOT reliably present on every runner image revision.
      # Strategy:
      #   1. Check if the full dev libs are already on the runner (fast path).
      #   2. If not, install the full OpenSSL package explicitly via Chocolatey
      #      (--force upgrades a pre-installed "light" version to the full one).
      #   3. Stage libcrypto.lib + libssl.lib into vendor/ which is already on
      #      AdditionalLibraryDirectories in every vcxproj that needs OpenSSL.
      #
      # This is intentionally explicit rather than relying on image pre-installs
      # because the runner image ships have historically varied between the "light"
      # (runtime-only) and "full" (developer) OpenSSL packages.
      - name: Ensure OpenSSL developer libs (libcrypto.lib / libssl.lib)
        shell: pwsh
        run: |
          # Ordered candidate paths — cover both choco-default and alternate layouts
          $candidates = @(
            'C:\Program Files\OpenSSL-Win64\lib\VC\x64\MD',
            'C:\Program Files\OpenSSL-Win64\lib',
            'C:\Program Files\OpenSSL\lib\VC\x64\MD',
            'C:\Program Files\OpenSSL\lib'
          )
          $libDir = $candidates | Where-Object { Test-Path "$_\libcrypto.lib" } | Select-Object -First 1

          if (-not $libDir) {
            Write-Host "libcrypto.lib not found in known paths — installing full OpenSSL via Chocolatey..."
            # --force ensures an existing light install is upgraded to the full dev package
            choco install openssl -y --no-progress --force
            # Re-probe after install
            $libDir = $candidates | Where-Object { Test-Path "$_\libcrypto.lib" } | Select-Object -First 1
          }

          if (-not $libDir) {
            Write-Error "libcrypto.lib still not found after choco install. Aborting."
            exit 1
          }

          Write-Host "OpenSSL lib dir: $libDir"
          foreach ($lib in 'libcrypto.lib', 'libssl.lib') {
            $src = Join-Path $libDir $lib
            if (Test-Path $src) {
              Copy-Item $src vendor\ -Force
              Write-Host "Staged: $lib -> vendor\"
            } else {
              Write-Warning "$lib not present in $libDir — linker may fail for this lib"
            }
          }

      - name: Build ShadowStrikePhantomService
        shell: pwsh
        run: |
          msbuild ShadowStrikePhantomService.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            $env:WPO_OVERRIDE $env:MP_OVERRIDE `
            /m:1 /nologo /flp:"LogFile=build_service.log;Verbosity=minimal"

      - name: Build ShadowStrikePhantomTray
        shell: pwsh
        run: |
          msbuild ShadowStrikePhantomTray.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            $env:WPO_OVERRIDE $env:MP_OVERRIDE `
            /m:1 /nologo /flp:"LogFile=build_tray.log;Verbosity=minimal"

      - name: Build ShadowStrikePhantomUI
        shell: pwsh
        run: |
          msbuild ShadowStrikePhantomUI.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            $env:WPO_OVERRIDE $env:MP_OVERRIDE `
            /m:1 /nologo /flp:"LogFile=build_ui.log;Verbosity=minimal"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-usermode
          path: |
            build_jit.log
            build_corelib.log
            build_service.log
            build_tray.log
            build_ui.log
          retention-days: 7

      # Stage all user-mode binaries into one flat directory for the
      # packaging job. Globbing here avoids hardcoding output paths that
      # differ between vcxproj configurations.
      - name: Stage user-mode binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force usermode-staging | Out-Null
          $exes = Get-ChildItem "x64\Release\*.exe" -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Error "No .exe files found in x64\Release — build may have failed"
            exit 1
          }
          $exes | Copy-Item -Destination usermode-staging\
          Write-Host "Staged: $($exes.Name -join ', ')"

      - name: Upload user-mode binaries
        uses: actions/upload-artifact@v4
        with:
          name: usermode-bin
          path: usermode-staging/
          retention-days: 1

  # ============================================================================
  # Job 2: Kernel driver (PhantomSensor.sys)
  # windows-2022 GitHub-hosted runners include WDK 10.0.x pre-installed.
  # The driver is test-signed with a temporary self-signed cert.
  # Production builds must use an EV code-signing cert (Azure Trusted Signing
  # or HSM) — replace the test-sign step with a call to your signing service.
  # ============================================================================
  build-driver:
    name: Kernel driver (x64 Release)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify WDK kernel headers
        shell: pwsh
        run: |
          $wdkRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $found = Get-ChildItem $wdkRoot -Directory |
                   Where-Object { Test-Path (Join-Path $_.FullName 'km\ntifs.h') } |
                   Sort-Object { [Version]($_.Name -replace '[^0-9.]', '') } -Descending |
                   Select-Object -First 1
          if (-not $found) {
            Write-Error "WDK km headers not found — driver build cannot proceed"
            exit 1
          }
          Write-Host "WDK: $($found.Name)"

      - name: Build PhantomSensor
        shell: pwsh
        run: |
          msbuild PhantomSensor\PhantomSensor.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            /p:InfVerif_Enable=false /p:InfVerif_NoError=true `
            /m /nologo /flp:"LogFile=build_driver.log;Verbosity=minimal"

      - name: Test-sign driver
        shell: pwsh
        run: |
          # Create a temporary code-signing cert valid for 1 year.
          # Targets must run with bcdedit /set testsigning on.
          $cert = New-SelfSignedCertificate `
            -Subject "CN=ShadowStrike TestSign, O=ShadowStrike Security" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA -KeyLength 2048 `
            -NotAfter (Get-Date).AddYears(1)
          Write-Host "Test cert: $($cert.Thumbprint)"

          # Locate signtool.exe shipped with the WDK/SDK
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
                        -Filter signtool.exe -Recurse |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object LastWriteTime -Descending |
                      Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }

          $sys = "build\installer\staging\drivers\PhantomSensor.sys"
          if (-not (Test-Path $sys)) {
            # Fallback: some WDK configs put the output directly under PhantomSensor\
            $sys = Get-ChildItem "PhantomSensor" -Filter PhantomSensor.sys -Recurse |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sys) { Write-Error "PhantomSensor.sys not found after build"; exit 1 }

          & $signtool sign /fd sha256 /s My /sha1 $cert.Thumbprint `
            /t http://timestamp.digicert.com "$sys"
          Write-Host "Signed: $sys"

      - name: Stage driver artifacts
        shell: pwsh
        run: |
          # Collect sys + inf + optional cat into a flat staging dir so the
          # download-artifact step in the packaging job has a predictable layout.
          New-Item -ItemType Directory -Force driver-staging | Out-Null

          $sys = Get-ChildItem "build\installer\staging\drivers\PhantomSensor.sys" `
                               -ErrorAction SilentlyContinue
          if (-not $sys) {
            $sys = Get-ChildItem "PhantomSensor" -Filter PhantomSensor.sys -Recurse |
                   Select-Object -First 1
          }
          Copy-Item $sys.FullName driver-staging\PhantomSensor.sys

          $inf = Get-ChildItem "PhantomSensor" -Filter PhantomSensor.inf -Recurse |
                 Select-Object -First 1
          if ($inf) { Copy-Item $inf.FullName driver-staging\PhantomSensor.inf }

          $cat = Get-ChildItem "build\installer\staging\drivers" -Filter "*.cat" `
                               -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cat) { Copy-Item $cat.FullName driver-staging\ }

          Write-Host "Driver staging:"
          Get-ChildItem driver-staging | Select-Object Name, Length

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-driver
          path: build_driver.log
          retention-days: 7

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driver-bin
          path: driver-staging/
          retention-days: 1

  # ============================================================================
  # Job 3: CLI — build the interactive terminal control surface.
  # The web UI has been removed; the CLI is the operator interface until
  # a new native GUI is ready.
  # ============================================================================
  build-cli:
    name: CLI (x64 Release)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ShadowStrikePhantomCLI
        shell: pwsh
        run: |
          msbuild ShadowStrikePhantomCLI.vcxproj `
            /t:Rebuild /p:Configuration=Release /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET /p:PreferredToolArchitecture=$env:PREFER_TOOL_ARCH `
            $env:WPO_OVERRIDE `
            /m:1 /nologo /flp:"LogFile=build_cli.log;Verbosity=minimal"

      - name: Verify CLI binary
        shell: pwsh
        run: |
          $cli = "x64\Release\ShadowStrikePhantomCLI.exe"
          if (-not (Test-Path $cli)) {
            Write-Error "ShadowStrikePhantomCLI.exe not found after build"
            exit 1
          }
          $size = [math]::Round((Get-Item $cli).Length / 1KB, 1)
          Write-Host "CLI binary: $size KB"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-cli
          path: build_cli.log
          retention-days: 7

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-bin
          path: x64/Release/ShadowStrikePhantomCLI.exe
          retention-days: 1

  # ============================================================================
  # Job 4: Rule validation — parse all rule corpora and fail if any corpus
  # produces zero rules, has duplicate IDs, or has parse errors above threshold.
  # Runs on ubuntu for speed (Python is faster to bootstrap than MSBuild here).
  # ============================================================================
  validate-rules:
    name: Rule corpus validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate native rules (rules/native/)
        run: |
          python - <<'PYEOF'
          import os, sys, yaml, collections

          rules_dir = "rules/native"
          errors = []
          warnings = []
          ids_seen = collections.Counter()
          rule_count = 0
          category_counts = collections.defaultdict(int)

          for category in sorted(os.listdir(rules_dir)):
            cat_path = os.path.join(rules_dir, category)
            if not os.path.isdir(cat_path):
              continue
            for rule_id in sorted(os.listdir(cat_path)):
              rule_path = os.path.join(cat_path, rule_id, "rule.yaml")
              if not os.path.exists(rule_path):
                warnings.append(f"Missing rule.yaml: {cat_path}/{rule_id}")
                continue
              with open(rule_path, "r", encoding="utf-8") as f:
                try:
                  doc = yaml.safe_load(f)
                except yaml.YAMLError as e:
                  errors.append(f"YAML parse error in {rule_path}: {e}")
                  continue
              if not isinstance(doc, dict):
                errors.append(f"Root is not a map: {rule_path}")
                continue
              rid = doc.get("id", "")
              if not rid:
                errors.append(f"Missing 'id' field: {rule_path}")
              else:
                ids_seen[rid] += 1
                if rid != rule_id:
                  warnings.append(f"ID mismatch: file folder '{rule_id}' vs rule id '{rid}' in {rule_path}")
              required = ["detection_name", "scope", "severity", "logic"]
              for field in required:
                if field not in doc:
                  errors.append(f"Missing required field '{field}': {rule_path}")
              if "logic" in doc and doc["logic"] is None:
                errors.append(f"Empty logic block: {rule_path}")
              rule_count += 1
              category_counts[category] += 1

          # Duplicate ID check
          for rid, count in ids_seen.items():
            if count > 1:
              errors.append(f"Duplicate rule ID '{rid}' appears {count} times")

          print(f"Native rules validated: {rule_count}")
          for cat, n in sorted(category_counts.items()):
            print(f"  {cat:30s}: {n}")

          if warnings:
            print(f"\nWarnings ({len(warnings)}):")
            for w in warnings:
              print(f"  WARN  {w}")

          if errors:
            print(f"\nErrors ({len(errors)}):")
            for e in errors:
              print(f"  ERROR {e}")
            sys.exit(1)
          elif rule_count == 0:
            print("ERROR: no native rules found — rules/native/ appears empty")
            sys.exit(1)
          else:
            print(f"\nAll {rule_count} native rules passed validation.")
          PYEOF

      - name: Validate external capa rules (spot-check)
        run: |
          python - <<'PYEOF'
          import os, sys, yaml

          capa_root = "rules/external/capa"
          if not os.path.isdir(capa_root):
            print(f"WARNING: {capa_root} not found — skipping capa validation")
            sys.exit(0)

          count = 0; errors = 0
          for root, dirs, files in os.walk(capa_root):
            for fn in files:
              if not fn.endswith((".yaml", ".yml")):
                continue
              fp = os.path.join(root, fn)
              with open(fp, "r", encoding="utf-8", errors="replace") as f:
                text = f.read()
              if "rule:" not in text:
                continue
              try:
                yaml.safe_load(text)
                count += 1
              except yaml.YAMLError:
                errors += 1

          print(f"capa rules parseable: {count}, errors: {errors}")
          if errors > 20:
            print(f"ERROR: {errors} capa YAML parse errors exceeds threshold")
            sys.exit(1)
          PYEOF

      - name: Check Sigma corpus is present
        run: |
          sigma_dir="rules/external/sigma"
          if [ ! -d "$sigma_dir" ]; then
            echo "ERROR: rules/external/sigma not found"
            exit 1
          fi
          count=$(find "$sigma_dir" -name "*.yaml" -o -name "*.yml" | wc -l)
          echo "Sigma rules found: $count"
          if [ "$count" -lt 100 ]; then
            echo "ERROR: too few Sigma rules ($count) — corpus may be missing"
            exit 1
          fi

      - name: Check Elastic corpus is present
        run: |
          ndjson="rules/external/elastic/custom-consolidated-rules.ndjson"
          if [ ! -f "$ndjson" ]; then
            echo "ERROR: $ndjson not found"
            exit 1
          fi
          lines=$(wc -l < "$ndjson")
          echo "Elastic rules (NDJSON lines): $lines"

  # ============================================================================
  # Job 5: Package — assemble all artifacts into a single downloadable ZIP.
  # Runs only after all build and validation jobs succeed.
  # ============================================================================
  package:
    name: Package release ZIP
    runs-on: windows-2022
    needs: [build-usermode, build-driver, build-cli, validate-rules]
    timeout-minutes: 15

    steps:
      - name: Checkout (for ORT DLLs and release docs)
        uses: actions/checkout@v4

      - name: Download user-mode binaries
        uses: actions/download-artifact@v4
        with:
          name: usermode-bin
          path: dist/

      - name: Download driver artifacts
        uses: actions/download-artifact@v4
        with:
          name: driver-bin
          path: dist/driver/

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: cli-bin
          path: dist/

      - name: Assemble package layout
        shell: pwsh
        run: |
          # ONNX Runtime — required at runtime (no static build available)
          Copy-Item vendor\onnxruntime\onnxruntime.dll                  dist\
          Copy-Item vendor\onnxruntime\onnxruntime_providers_shared.dll dist\

          # Verify all required binaries are present before packaging
          $required = @(
            'dist\ShadowStrikePhantomService.exe',
            'dist\ShadowStrikePhantomCLI.exe',
            'dist\driver\PhantomSensor.sys',
            'dist\onnxruntime.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Required files missing from package layout:`n$($missing -join "`n")"
            exit 1
          }

          # NOTE: rule corpus is compiled directly into ShadowStrikePhantomService.exe
          # as an XOR-obfuscated binary blob. No rules/ directory is needed or included.

          # Version stamp
          $sha  = "${{ github.sha }}".Substring(0, 8)
          $ref  = "${{ github.ref_name }}"
          @"
ShadowStrike Phantom
Ref  : $ref
SHA  : $sha
Date : $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')

Detection rules: compiled into ShadowStrikePhantomService.exe (embedded, not on disk).
ONNX model files (.onnx) are NOT included.
Deploy trained models to %ProgramData%\ShadowStrike\models\ separately.
The service runs without models; ML scoring is inactive until models are present.
"@ | Out-File dist\VERSION.txt -Encoding utf8

          Write-Host "=== Package layout ==="
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Generate release documentation
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 8)
          $ref = "${{ github.ref_name }}"
          $date = Get-Date -Format "yyyy-MM-dd"

          $doc = @"
# ShadowStrike Phantom — Release Package

**Version**: ``$ref``
**Build SHA**: ``$sha``
**Date**: $date

---

## Contents of this Package

| File | Description |
|------|-------------|
| ``ShadowStrikePhantomService.exe`` | Windows service — detection engine, IPC server, ~3 400+ rules compiled in |
| ``ShadowStrikePhantomCLI.exe`` | Interactive terminal control interface (run in an elevated terminal) |
| ``ShadowStrikePhantomTray.exe`` | System-tray status notification app |
| ``ShadowStrikePhantomUI.exe`` | Native Windows UI (preview) |
| ``onnxruntime.dll`` | ONNX Runtime — required for ML inference |
| ``onnxruntime_providers_shared.dll`` | ONNX Runtime execution provider |
| ``driver\PhantomSensor.sys`` | Kernel minifilter driver (test-signed) |
| ``driver\PhantomSensor.inf`` | Driver INF — used by pnputil for installation |
| ``VERSION.txt`` | Build version stamp |
| ``RELEASE.md`` | This file |

---

## Prerequisites

- **OS**: Windows 10 21H2 or later (x64). Windows 11 recommended.
- **Architecture**: x64 only.
- **Privileges**: Installation requires elevation (Administrator or SYSTEM).
- **Test-signing** (for driver): The kernel driver in this package is **test-signed**
  (not EV-signed). This means:
  - It will NOT load on production systems by default.
  - For development / evaluation use, enable test-signing mode (see below).
  - For production deployment, the driver must be signed with a valid EV
    code-signing certificate via Microsoft's Windows Hardware Dev Center or
    Azure Trusted Signing. Do NOT use test-signing mode in production environments.

---

## Installation (Development / Evaluation)

> ⚠️ All commands below require an **elevated Command Prompt** (Run as Administrator).

### Step 1 — Enable test-signing (once; requires reboot)

```cmd
bcdedit /set testsigning on
shutdown /r /t 0
```

*After the reboot, a "Test Mode" watermark will appear on the desktop.*

### Step 2 — Install the kernel driver

```cmd
pnputil /add-driver driver\PhantomSensor.inf /install
```

Verify the driver loaded:
```cmd
sc query PhantomSensor
```
Expected: ``STATE: 4  RUNNING``

### Step 3 — Install and start the service

```cmd
ShadowStrikePhantomService.exe --install
ShadowStrikePhantomService.exe --start
```

Or via the Service Control Manager:
```cmd
sc start PhantomService
```

### Step 4 — Launch the CLI

```cmd
ShadowStrikePhantomCLI.exe
```

The CLI connects to the service over a named pipe (``\\.\pipe\PhantomService``).
It runs in interactive mode by default. Pass a subcommand to run a single operation:

```cmd
ShadowStrikePhantomCLI.exe status
ShadowStrikePhantomCLI.exe detections --limit 50
ShadowStrikePhantomCLI.exe scan C:\Users\user\Downloads
ShadowStrikePhantomCLI.exe rules status
ShadowStrikePhantomCLI.exe help
```

---

## Starting Order

1. Ensure the kernel driver (``PhantomSensor.sys``) is loaded first.
2. Start the ``PhantomService`` Windows service.
3. The CLI, Tray, and UI applications connect to the service; they can be started in any order after the service is running.

---

## Detection Rules

Detection rules (~3 400+ across four corpora) are compiled directly into
``ShadowStrikePhantomService.exe`` as an XOR-obfuscated binary blob.
No plaintext rule files are required on disk at runtime.

To update rules, rebuild from source and redeploy the service binary.

Rule corpora included:
- **Native** (ShadowStrike hand-written) — organized by detection category
- **capa** (FireEye/Mandiant capability rules v9.4.0)
- **Sigma** (Windows detection rules)
- **Elastic** (Windows detection rules — NDJSON)

---

## ML Models

ML model files (``*.onnx``) are **not included** in this package due to size.

To enable ML scoring:
1. Train models using ``PhantomCortex/training/scripts/train_all.py``
   (or obtain pre-trained models from the project's model repository).
2. Deploy the ``.onnx`` files to:
   ``%ProgramData%\ShadowStrike\models\``
3. Set the model directory in registry:
   ``HKLM\SOFTWARE\ShadowStrike\PhantomCortex\ModelDirectory``

The service operates fully without ML models — only the ML scoring stage
is inactive. All rule-based and behavioural detections work regardless.

---

## Troubleshooting

| Symptom | Likely cause | Fix |
|---------|--------------|-----|
| Driver fails to load | Test-signing not enabled | Run ``bcdedit /set testsigning on`` and reboot |
| ``Code integrity`` error | Signature mismatch | Re-sign with valid cert, or use test-signing for dev |
| CLI reports "service not reachable" | Service not running | ``sc start PhantomService`` |
| Service exits immediately | Missing dependency DLL | Ensure ``onnxruntime.dll`` is alongside the .exe |
| High CPU during first run | Initial rule JIT compilation | Normal; subsides after warm-up |
| No ML detections | Models not deployed | Copy ``.onnx`` files to models directory (see above) |

---

## Limitations (this build)

- Driver is **test-signed only** — not suitable for production.
- ML models not bundled — deploy separately.
- The web UI has been removed; the CLI is the operator interface.
  A native GUI is planned for a future release.

