id: ss-static-009
detection_name: "Win32/SignerAbuse.MaliciousContent"
description: "Signed binary with anomalously high entropy or unbounded import count — possible signed malware or signer abuse."
scope: static
severity: high
status: stable
source: native
confidence: 0.65
weight: 1.8
version: 1
attack:
  - tactic: TA0005
    technique: T1553
    sub_technique: T1553.002
    name: "Subvert Trust Controls: Code Signing"
logic:
  and:
    - field_equals:
        field: file.signer.signed
        value: "true"
    - entropy_above:
        ratio: 7.4
    - or:
        - import_count_above:
            number: 300
        - unique_api_count_above:
            number: 200
        - characteristic: high-entropy-section
fp_guard:
  notes:
    - "Large enterprise applications legitimately have many imports. Tune thresholds per environment."
    - "Packer/protector products (Safeguard, Obsidium) also produce high-entropy signed binaries."
